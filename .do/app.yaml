# App Spec testovacieho prostredia na DigitalOcean (spec #77, Nasadenie; docs/adr/0001-stack.md).
# Hodnoty tu nie sú, len zástupky v tvare dolár a zložené zátvorky. Zástupky bez bodky (IMAGE_TAG, tajomstvá)
# doplní workflow `deploy` z GitHub secrets, APP_URL a zástupky s bodkou (db.DATABASE_URL) doplní DigitalOcean.
# Komentáre zástupky nepíšu: action ich nahrádza v celom texte súboru a test v tools/deploy-config.test.ts ich počíta aj tam.
# Appku z tohto súboru zakladá prvý beh workflow, postup je v README.
name: servisnik-test
region: fra

services:
  - name: web
    image: &image # aj obraz oboch jobov
      registry_type: DOCR # register vytvára Kazarr, názov registra pozná workflow
      repository: servisnik
      tag: ${IMAGE_TAG} # SHA commitu, ktorý workflow zostavil
    http_port: 3000
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
      timeout_seconds: 5 # /api/health čaká na databázu najviac 2 s
    envs:
      # URL ide tak, ako ju DigitalOcean viaže; appka ju overuje proti CA z DATABASE_CA_CERT (apps/web/src/db/index.ts).
      - &database_url
        key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - &database_ca_cert
        key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${db.CA_CERT}
      - key: BETTER_AUTH_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${BETTER_AUTH_SECRET}
      - key: BETTER_AUTH_URL
        scope: RUN_TIME
        value: ${APP_URL}
      # Hlavička s adresou klienta, podľa ktorej Better Auth obmedzuje pokusy o prihlásenie a zmenu hesla (apps/web/src/auth.ts).
      # Ingress DigitalOcean dáva do x-forwarded-for seba, klienta do do-connecting-ip.
      - key: CLIENT_IP_HEADER
        scope: RUN_TIME
        value: do-connecting-ip
      # KROS_* appka zatiaľ nečíta; workflow ich nevyžaduje, kým ich nezačne čítať #81.
      - key: KROS_API_URL
        scope: RUN_TIME
        value: ${KROS_API_URL}
      - key: KROS_API_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: ${KROS_API_TOKEN}
      - key: KROS_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${KROS_WEBHOOK_SECRET}
      - key: KROS_VAT_PAYER_TYPE
        scope: RUN_TIME
        value: ${KROS_VAT_PAYER_TYPE}

jobs:
  # Pred každým nasadením aplikuje migrácie; zlyhanie zastaví nasadenie a stará verzia beží ďalej.
  - name: migrate
    kind: PRE_DEPLOY
    image: *image
    run_command: node /migrate/apps/web/scripts/migrate.ts
    envs:
      - *database_url
      - *database_ca_cert

  # Po každom nasadení založí admina, keď ešte žiadny nie je (používateľa s ADMIN_EMAIL spraví adminom s heslom
  # ADMIN_PASSWORD); existujúcemu adminovi nezmení heslo ani e-mail (idempotentné). Prihlasovacie údaje má len
  # tento job: bežiaca služba ich nevidí.
  - name: seed
    kind: POST_DEPLOY
    image: *image
    run_command: node /migrate/apps/web/scripts/seed.ts
    envs:
      - *database_url
      - *database_ca_cert
      - key: ADMIN_EMAIL
        scope: RUN_TIME
        type: SECRET
        value: ${ADMIN_EMAIL}
      - key: ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: ${ADMIN_PASSWORD}

databases:
  # Spravovaný cluster PostgreSQL 17 vo FRA1, ktorý Kazarr založí rukou pred prvým behom (README, Nasadenie).
  - name: db
    engine: PG
    version: "17"
    production: true
    cluster_name: servisnik-test-db
