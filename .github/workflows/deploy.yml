name: deploy
run-name: Nasadenie ${{ github.sha }}

# Nasadí testovacie prostredie na DigitalOcean (spec #77, Nasadenie). Spúšťa ho Kazarr rukou:
# Actions > deploy > Run workflow, z vetvy main. Postup a to, čo treba nastaviť raz, je v README, časť Nasadenie.
# workflow_dispatch beží na ľubovoľnej vetve a vetva si môže priniesť vlastný ci.yml aj gate, preto secrets
# sú v environmente `test` obmedzenom na main a job iné vetvy sám odmietne.
on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Bez toho beží krok pod `bash -e` bez pipefail: pipe, ktorej prvý príkaz zlyhá, by prešla (tools/deploy-config.test.ts).
    defaults:
      run:
        shell: bash
    steps:
      # Prvé: bez secretov nemá zmysel nič zostavovať. KROS_* sa nevyžadujú, kým ich nezačne čítať #81.
      - name: Check that the secrets are set
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          missing=""
          for name in DIGITALOCEAN_ACCESS_TOKEN BETTER_AUTH_SECRET ADMIN_EMAIL ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Chýbajú secrets prostredia test::Chýba:$missing. Nastav ich v Settings > Environments > test (README, časť Nasadenie)."
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Only a commit with a green ticket check
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=ticket&per_page=100" --paginate --jq '.check_runs[]' | node tools/deploy-gate.ts

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # Garbage collection, ktorú spustil krok na konci predošlého behu, beží asynchrónne a drží register len na čítanie,
      # kým neskončí: push by v tom čase zlyhal.
      - name: Wait for the registry garbage collection
        run: |
          attempts=${GC_POLL_ATTEMPTS:-30}
          seconds=${GC_POLL_SECONDS:-20}
          for attempt in $(seq 1 "$attempts"); do
            doctl registry garbage-collection get-active > /dev/null 2>&1 || exit 0
            echo "Register zbiera garbage a je len na čítanie, čakám (pokus $attempt z $attempts)."
            sleep "$seconds"
          done
          echo "::error title=Register je len na čítanie::Garbage collection beží aj po $((attempts * seconds)) s, push by zlyhal."
          exit 1

      - name: Build the image and push it to the DigitalOcean registry
        id: push
        run: |
          doctl registry login --expiry-seconds 3600
          registry=$(doctl registry get --format Name --no-header) || { echo "::error title=Chýba register::V DigitalOcean nie je container registry (README, časť Nasadenie)."; exit 1; }
          image="registry.digitalocean.com/${registry}/servisnik:$GITHUB_SHA"
          docker build --build-arg GIT_SHA="$GITHUB_SHA" --tag "$image" .
          docker push "$image"

      # Čo je v logu bežiacej verzie už pred nasadením, nie je po ňom nové. Kým appka nie je (prvé nasadenie), je log prázdny.
      - name: Record the run log of the running version
        run: |
          app=$(sed -n 's/^name: *//p' .do/app.yaml)
          doctl apps logs "$app" web --type run --tail 2000 > "$RUNNER_TEMP/run-before.log" || {
            : > "$RUNNER_TEMP/run-before.log"
            echo "::notice title=Log pred nasadením::Log appky $app sa nedal prečítať (prvé nasadenie?), porovná sa s prázdnym."
          }

      # Vytvorí appku zo .do/app.yaml, ak ešte nie je, inak ju aktualizuje, a počká na dokončenie nasadenia.
      - name: Deploy the App Spec
        id: deploy
        uses: digitalocean/app_action/deploy@cc55bc9b848d25f9c1c9f831cf843fbab3fbfb15 # v2.0.11
        env:
          IMAGE_TAG: ${{ github.sha }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          KROS_API_URL: ${{ secrets.KROS_API_URL }}
          KROS_API_TOKEN: ${{ secrets.KROS_API_TOKEN }}
          KROS_WEBHOOK_SECRET: ${{ secrets.KROS_WEBHOOK_SECRET }}
          KROS_VAT_PAYER_TYPE: ${{ secrets.KROS_VAT_PAYER_TYPE }}
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: .do/app.yaml
          print_build_logs: true
          print_deploy_logs: false # repo je verejný

      # Okrem odpovedí 200 overí, že /api/health hlási práve nasadený commit (image ho dostal cez --build-arg).
      - name: Smoke the deployed app
        env:
          LIVE_URL: ${{ fromJSON(steps.deploy.outputs.app).live_url }}
        run: pnpm smoke "$LIVE_URL" "$GITHUB_SHA"

      # Smoke už appku zavolal, takže prípadná chyba pri jej štarte alebo pri prvých požiadavkách je v logu. Text chýb
      # sa nevypisuje: log behu verejného repa je verejný.
      - name: Compare the run log with the one before the deploy
        env:
          APP_ID: ${{ fromJSON(steps.deploy.outputs.app).id }}
        run: |
          doctl apps logs "$APP_ID" web --type run --tail 2000 > "$RUNNER_TEMP/run-after.log"
          node tools/log-diff.ts "$RUNNER_TEMP/run-before.log" "$RUNNER_TEMP/run-after.log"

      # Register v úrovni Starter drží 500 MiB (README). Po každom pushi, aj keď nasadenie zlyhalo (séria zlyhaných
      # nasadení by register zaplnila), ostanú najnovšie tagy (počet je v tools/registry-retention.ts) a tagy, ktoré
      # práve beží nasadená appka; ostatné sa zmažú a garbage collection uvoľní ich vrstvy. Ak sa živý tag nedá zistiť, nič sa nemaže.
      # Garbage collection beží ďalej po skončení kroku; ďalší beh na ňu čaká pred pushom.
      - name: Keep the newest image tags and collect the garbage
        if: always() && steps.push.outcome == 'success'
        run: |
          app=$(sed -n 's/^name: *//p' .do/app.yaml)
          doctl apps list --output json > "$RUNNER_TEMP/apps.json"
          doctl registry repository list-tags servisnik --output json | node tools/registry-retention.ts "$GITHUB_SHA" "$app" "$RUNNER_TEMP/apps.json" | xargs --no-run-if-empty doctl registry repository delete-tag servisnik --force
          doctl registry garbage-collection start --include-untagged-manifests --force
