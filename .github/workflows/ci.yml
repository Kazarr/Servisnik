name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Job name is the required status check on main (ruleset "main").
  ticket:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commit check reads the whole history of the branch
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
        env:
          # A PR is checked against its base; a push to main has no base_ref and falls back to origin/main.
          CHECK_COMMITS_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) }}
