name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Job name is the required status check on main (ruleset "main").
  ticket:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # a shallow clone lacks origin/<base_ref>, which the commit check reads up to HEAD
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium prints the PDFs of the forms, and the tests of the ticket tier read them (apps/web/test/pdf.test.ts).
      # The root script of the README, with the libraries of the runner and without the full browser, which no test opens.
      - run: pnpm e2e:install --with-deps --only-shell
      - run: pnpm verify
        env:
          # The commit check reads origin/<base_ref>..HEAD. A push to main has no base_ref, so it falls
          # back to origin/main, which is HEAD itself: an empty range, nothing is checked there.
          CHECK_COMMITS_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) }}
